<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Videos — DASH</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
:root{--yt:#ff0000;--teal:#ff0000;--teal2:#ff4444;--bg:#0f0f0f;--panel:#212121;--card:#272727;--b2:#3d3d3d;--text:#f1f1f1;--muted:#aaaaaa;--red:#ff0000;--amber:#f59e0b;--green:#2ba640}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Sora',sans-serif;background:var(--bg);color:var(--text)}
button,input,textarea,select{font-family:'Sora',sans-serif}
a{text-decoration:none;color:inherit}

/* TOPBAR */
/* ── TOPBAR ── */
.topbar{height:56px;background:#212121;border-bottom:1px solid #3d3d3d;display:flex;align-items:center;padding:0 16px;gap:10px;position:sticky;top:0;z-index:100}
.logo{display:flex;align-items:center;gap:6px}
.logo-icon{background:#ff0000;color:#fff;border-radius:6px;width:26px;height:19px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900}
.logo-text{font-size:16px;font-weight:900;color:#fff;letter-spacing:-.3px}
.sep{width:1px;height:20px;background:#3d3d3d}
.page-lbl{font-size:12px;font-weight:600;color:var(--muted)}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.t-avatar{width:32px;height:32px;border-radius:50%;background:#ff0000;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}
.t-avatar img{width:100%;height:100%;object-fit:cover}
.t-name{font-size:12px;font-weight:700;color:var(--text)}
.t-role{font-size:10px;color:#ff0000;font-weight:600}
.back-btn{display:flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--muted);background:none;border:none;cursor:pointer;padding:5px 8px;border-radius:6px;transition:all .15s}
.back-btn:hover{color:#fff;background:rgba(255,255,255,.08)}

/* NO AUTH */
#noAuth{display:none;flex-direction:column;align-items:center;justify-content:center;height:calc(100vh - 56px);gap:12px;color:var(--muted)}
#noAuth.show{display:flex}

/* PAGE */
.page{max-width:1280px;margin:0 auto;padding:16px 8px 80px}

/* STATS */
.stats-row{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.stat-chip{background:var(--panel);border:1px solid var(--b2);border-radius:20px;padding:6px 14px;display:flex;align-items:center;gap:6px}
.stat-num{font-size:15px;font-weight:900;color:#ff0000}
.stat-lbl{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px}

/* PROGRESS BAR */
.progress-bar-wrap{background:var(--panel);border:1px solid var(--b2);border-radius:8px;padding:10px 14px;margin-bottom:14px}
.progress-bar-label{display:flex;justify-content:space-between;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:6px}
.progress-bar-label span:last-child{color:#ff0000}
.progress-bar-track{height:3px;background:var(--card);border-radius:99px;overflow:hidden}
.progress-bar-fill{height:100%;background:#ff0000;border-radius:99px;transition:width .5s ease}

/* TOOLBAR */
.toolbar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap;padding:0 4px}
.admin-lbl{font-size:11px;font-weight:700;color:#ff0000;text-transform:uppercase;letter-spacing:.5px;margin-right:2px}
.btn{border:none;border-radius:20px;padding:7px 16px;font-size:12px;font-weight:700;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:5px}
.btn-p{background:#ff0000;color:#fff}.btn-p:hover{background:#cc0000}
.btn-g{background:rgba(255,255,255,.08);color:var(--text);border:1px solid var(--b2)}.btn-g:hover{background:rgba(255,255,255,.14)}
.btn-g.active{background:rgba(255,255,255,.15);border-color:#fff;color:#fff}
.view-toggle{display:flex;background:var(--card);border-radius:20px;padding:2px;border:1px solid var(--b2)}
.vt-btn{background:none;border:none;cursor:pointer;padding:5px 9px;border-radius:18px;color:var(--muted);transition:all .15s;font-size:14px}
.vt-btn.active{background:#ff0000;color:#fff}

/* CHIP FILTER BAR */
.chip-bar{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto;padding:0 4px 4px;scrollbar-width:none}
.chip-bar::-webkit-scrollbar{display:none}
.chip{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.12);color:var(--text);border-radius:20px;padding:6px 14px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .15s;font-family:'Sora',sans-serif}
.chip:hover{background:rgba(255,255,255,.18)}
.chip.active{background:#fff;color:#0f0f0f;border-color:#fff}

/* SEARCH */
.search-row{display:flex;gap:8px;margin-bottom:14px;padding:0 4px}
.s-wrap{flex:1;position:relative;display:flex}
.s-ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px;pointer-events:none}
.s-inp{flex:1;background:#121212;border:1px solid var(--b2);border-radius:24px;padding:9px 16px 9px 38px;font-size:13px;color:var(--text);outline:none;transition:border .15s;font-family:'Sora',sans-serif;width:100%}
.s-inp:focus{border-color:rgba(255,255,255,.35);background:#1a1a1a}
.s-inp::placeholder{color:var(--muted)}
.f-sel{background:#121212;border:1px solid var(--b2);border-radius:24px;padding:9px 16px;font-size:12px;color:var(--text);outline:none;cursor:pointer;font-family:'Sora',sans-serif}
.f-sel:focus{border-color:#ff0000}

/* ── YOUTUBE HOME GRID ── */
.yt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:0;margin-bottom:8px}
.yt-card{cursor:pointer;padding:0 8px 24px;transition:none;position:relative;display:flex;flex-direction:column}
.yt-thumb-wrap{position:relative;aspect-ratio:16/9;background:#1a1a1a;border-radius:12px;overflow:hidden;margin-bottom:10px}
.yt-thumb-wrap img{width:100%;height:100%;object-fit:cover;transition:transform .35s ease}
.yt-card:hover .yt-thumb-wrap img{transform:scale(1.04)}
.yt-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:36px;background:#1a1a1a}
.yt-src{position:absolute;top:8px;right:8px;border-radius:4px;padding:2px 6px;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.4px}
.src-youtube{background:#ff0000;color:#fff}.src-tiktok{background:#010101;color:#fff}
.src-drive{background:#1a73e8;color:#fff}.src-vimeo{background:#19b7ea;color:#fff}.src-otro{background:var(--muted);color:#fff}
.yt-new{position:absolute;top:8px;left:8px;background:var(--amber);color:#fff;font-size:8px;font-weight:800;padding:2px 6px;border-radius:4px;text-transform:uppercase;letter-spacing:.4px}
.yt-watched-bar{position:absolute;bottom:0;left:0;height:3px;background:#ff0000}
.yt-watched-bar.full{width:100%;background:#888}
.yt-overlay{position:absolute;inset:0;background:rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s;border-radius:12px}
.yt-card:hover .yt-overlay{opacity:1}
.yt-play-btn{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.95);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 16px rgba(0,0,0,.5)}
.yt-meta{display:flex;gap:10px;align-items:flex-start;padding:0 2px}
.yt-channel-av{width:36px;height:36px;border-radius:50%;background:#2a2a2a;border:1px solid #3d3d3d;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:16px;margin-top:1px}
.yt-info{flex:1;min-width:0}
.yt-title{font-size:13px;font-weight:700;color:#fff;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:4px}
.yt-sub-info{font-size:11px;color:var(--muted);line-height:1.5}
.yt-sub-info .yt-tema{color:rgba(255,255,255,.45);font-weight:600;display:block}
.yt-actions{display:flex;gap:4px;margin-top:8px;padding-left:46px;flex-wrap:wrap}
.fav-btn{background:rgba(225,29,72,.1);color:#f43f5e;border:1px solid rgba(225,29,72,.25);font-family:'Sora',sans-serif}
.fav-btn:hover{background:rgba(225,29,72,.2)}
.fav-btn.active{background:#e11d48;color:#fff;border-color:#e11d48}
.watch-btn{background:rgba(22,163,74,.1);color:#4ade80;border:1px solid rgba(22,163,74,.25);font-family:'Sora',sans-serif}
.watch-btn:hover{background:rgba(22,163,74,.2)}
.watch-btn.active{background:#2ba640;color:#fff;border-color:#2ba640}
.be{background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe}.be:hover{background:#dbeafe}
.bd{background:rgba(239,68,68,.12);color:#f87171;border:1px solid rgba(239,68,68,.25)}.bd:hover{background:rgba(239,68,68,.2)}

/* ── Card action buttons — YouTube monochrome ── */
.yt-actions{display:flex;gap:6px;margin-top:8px;padding-left:46px;align-items:center}
.yt-act-btn{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.1);border:none;color:#fff;border-radius:20px;padding:6px 14px;font-size:11px;font-weight:700;cursor:pointer;transition:all .15s;font-family:'Sora',sans-serif;white-space:nowrap}
.yt-act-btn:hover{background:rgba(255,255,255,.18)}
.yt-act-btn.fav-active{background:rgba(255,255,255,.18);color:#fff}
.yt-act-btn.watch-active{background:rgba(255,255,255,.18);color:#fff}
.yt-icon-btn{display:inline-flex;align-items:center;justify-content:center;background:transparent;border:none;color:rgba(255,255,255,.4);border-radius:50%;width:30px;height:30px;cursor:pointer;transition:all .15s;font-size:14px}
.yt-icon-btn:hover{background:rgba(255,255,255,.1);color:#fff}
.yt-section-hdr{font-size:15px;font-weight:800;color:#fff;margin:16px 0 10px;padding:0 12px;display:flex;align-items:center;gap:8px}
.yt-section-hdr::after{content:'';flex:1;height:1px;background:#2d2d2d;margin-left:8px}

/* EMPTY */
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty-ico{font-size:40px;margin-bottom:12px}

/* SPINNER */
.spinner{width:36px;height:36px;border:3px solid rgba(255,0,0,.2);border-top-color:#ff0000;border-radius:50%;animation:spin .7s linear infinite;margin:60px auto}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── PLAYER MODAL ── */
#playerModal{display:none;position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.92);align-items:center;justify-content:center;padding:12px}
#playerModal.show{display:flex}
.p-wrap{background:#0f0f0f;border-radius:12px;width:100%;max-width:820px;overflow:hidden;box-shadow:0 40px 100px rgba(0,0,0,.8);animation:pop .2s cubic-bezier(.34,1.56,.64,1);border:1px solid #2d2d2d}
@keyframes pop{from{opacity:0;transform:scale(.93)}to{opacity:1;transform:scale(1)}}
.p-head{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#212121;border-bottom:1px solid #2d2d2d}
.p-ttl{font-size:13px;font-weight:700;color:#fff;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p-head-btns{display:flex;gap:6px;align-items:center;flex-shrink:0}
.p-fav-btn{background:transparent;border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.6);border-radius:20px;width:34px;height:30px;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.p-fav-btn:hover{border-color:#ff0000;color:#ff0000;background:rgba(255,0,0,.1)}
.p-fav-btn.active{background:#ff0000;color:#fff;border-color:#ff0000}
.p-watch-btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);color:#fff;border-radius:20px;padding:0 14px;height:30px;font-size:11px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:5px;transition:all .15s}
.p-watch-btn:hover{background:rgba(255,255,255,.2)}
.p-watch-btn.active{background:#2ba640;border-color:#2ba640}
.p-x{background:transparent;border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.6);border-radius:50%;width:30px;height:30px;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.p-x:hover{background:rgba(255,255,255,.1);color:#fff}
.p-frame{position:relative;padding-top:56.25%;background:#000}
.p-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:none}
.p-foot{padding:8px 14px;font-size:11px;color:rgba(255,255,255,.4);display:flex;gap:12px;align-items:center;background:#181818;border-top:1px solid #242424}
.p-views-badge{margin-left:auto;font-size:10px;color:rgba(255,255,255,.3)}

/* EDIT MODAL */
#editModal{display:none;position:fixed;inset:0;z-index:600;background:rgba(0,0,0,.55);align-items:center;justify-content:center;padding:16px}
#editModal.show{display:flex}
.e-wrap{background:#212121;border:1px solid #3a3a3a;border-radius:14px;width:100%;max-width:460px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.6);animation:pop .18s ease}
.e-head{padding:16px 16px 0;display:flex;align-items:center;justify-content:space-between}
.e-head h3{font-size:15px;font-weight:800}
.e-x{background:rgba(255,255,255,.08);border:none;border-radius:50%;width:28px;height:28px;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.e-x:hover{background:rgba(255,255,255,.15);color:var(--text)}
.e-body{padding:16px;display:flex;flex-direction:column;gap:12px}
.fl{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;margin-bottom:4px}
.fi{width:100%;background:#1a1a1a;border:1px solid var(--b2);border-radius:8px;padding:9px 12px;font-size:13px;color:var(--text);outline:none;transition:border .15s}
.fi:focus{border-color:var(--teal)}
.fi::placeholder{color:var(--muted)}
.u-prev{margin-top:6px;border-radius:8px;overflow:hidden;aspect-ratio:16/9;background:#0f0f0f;display:none}
.u-prev.show{display:block}
.u-prev iframe{width:100%;height:100%;border:none}
.e-foot{padding:0 16px 16px;display:flex;gap:8px;justify-content:flex-end}

/* TOAST */
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(16px);background:#272727;border:1px solid #3a3a3a;color:#f1f1f1;padding:9px 18px;border-radius:20px;font-size:12px;font-weight:700;z-index:9999;opacity:0;transition:all .2s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:960px){.yt-grid{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}}
@media(max-width:600px){.yt-grid{grid-template-columns:repeat(2,1fr)}.t-name,.t-role{display:none}}
@media(max-width:400px){.yt-grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="topbar">
  <button class="back-btn" onclick="goBack()">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    Inicio
  </button>
  <div class="sep"></div>
  <div class="logo"><div class="logo-icon">▶</div><span class="logo-text">DASH</span></div>
  <div class="sep"></div>
  <span class="page-lbl">Videos</span>
  <div class="topbar-right">
    <div class="t-avatar" id="tAv">?</div>
    <div><div class="t-name" id="tName">—</div><div class="t-role" id="tRole">—</div></div>
  </div>
</div>

<div id="noAuth" style="display:none;flex-direction:column;align-items:center;justify-content:center;height:calc(100vh - 52px);gap:12px;color:var(--muted)">
  <div style="font-size:36px">🔒</div>
  <p style="font-size:14px">Debes iniciar sesión para ver los videos.</p>
  <button class="btn btn-p" onclick="goBack()">← Ir al inicio</button>
</div>

<div class="page" id="mainPage" style="display:none">

  <!-- STATS + PROGRESO -->
  <div class="stats-row">
    <div class="stat-chip"><span class="stat-num" id="sTotal">0</span><span class="stat-lbl">Videos</span></div>
    <div class="stat-chip"><span class="stat-num" id="sTemas">0</span><span class="stat-lbl">Temas</span></div>
    <div class="stat-chip"><span class="stat-num" id="sSubs">0</span><span class="stat-lbl">Subtemas</span></div>
    <div class="stat-chip"><span class="stat-num" id="sWatched">0</span><span class="stat-lbl">Vistos</span></div>
  </div>

  <!-- BARRA DE PROGRESO GLOBAL -->
  <div class="progress-bar-wrap" id="progressWrap" style="display:none">
    <div class="progress-bar-label">
      <span>Progreso general</span>
      <span id="progressPct">0%</span>
    </div>
    <div class="progress-bar-track"><div class="progress-bar-fill" id="progressFill" style="width:0%"></div></div>
  </div>

  <!-- TOOLBAR -->
  <div class="toolbar" id="toolbar">
    <!-- Admin buttons (hidden by default) -->
    <span class="admin-lbl" id="adminLbl" style="display:none">Admin</span>
    <button class="btn btn-p" id="addBtn" style="display:none" onclick="openAdd()">+ Agregar video</button>
    <div style="margin-left:auto;display:flex;gap:6px;align-items:center">
      <button class="btn btn-g" id="favFilterBtn" onclick="toggleFavFilter()">♥ Favoritos</button>
    </div>
  </div>

  <!-- CHIP BAR -->
  <div class="chip-bar" id="chipBar"><button class="chip active" data-tema="" onclick="setChip(this)">Todos</button></div>
  <!-- SEARCH -->
  <div class="search-row">
    <div class="s-wrap">
      <span class="s-ico">🔍</span>
      <input class="s-inp" id="sInp" placeholder="Buscar videos…" oninput="filter()"/>
    </div>
  </div>
  <select class="f-sel" id="tFil" onchange="filter()" style="display:none"><option value="">Todos los temas</option></select>

  <div id="content"><div class="spinner"></div></div>
</div>

<!-- PLAYER MODAL -->
<div id="playerModal" onclick="if(event.target===this)closePlayer()">
  <div class="p-wrap">
    <div class="p-head">
      <span class="p-ttl" id="pTtl">—</span>
      <div class="p-head-btns">
        <button class="p-fav-btn" id="pFavBtn" onclick="toggleFavFromPlayer()" title="Favorito">♥</button>
        <button class="p-watch-btn" id="pWatchBtn" onclick="toggleWatchFromPlayer()">✓ Marcar visto</button>
        <button class="p-x" onclick="closePlayer()">✕</button>
      </div>
    </div>
    <div class="p-frame" id="pFrameWrap">
      <iframe id="pFr" allowfullscreen allow="autoplay; encrypted-media"></iframe>
    </div>
    <div class="p-foot">
      <span id="pMeta"></span>
      <span class="p-views-badge" id="pViews"></span>
    </div>
  </div>
</div>

<!-- EDIT MODAL -->
<div id="editModal" onclick="if(event.target===this)closeEdit()">
  <div class="e-wrap">
    <div class="e-head">
      <h3 id="eH">Agregar video</h3>
      <button class="e-x" onclick="closeEdit()">✕</button>
    </div>
    <div class="e-body">
      <div>
        <div class="fl">URL del video *</div>
        <input class="fi" id="eUrl" placeholder="YouTube, Vimeo, Google Drive…" oninput="prevUrl()"/>
        <div class="u-prev" id="uPrev"><iframe id="pIfr" allowfullscreen></iframe></div>
      </div>
      <div><div class="fl">Título *</div><input class="fi" id="eTtl" placeholder="Ej: Razones Trigonométricas — Introducción"/></div>
      <div><div class="fl">Tema *</div><input class="fi" id="eTema" placeholder="Ej: Pensamiento Matemático" list="dlT"/><datalist id="dlT"></datalist></div>
      <div><div class="fl">Subtema *</div><input class="fi" id="eSub" placeholder="Ej: Razones Trigonométricas" list="dlS"/><datalist id="dlS"></datalist></div>
      <div><div class="fl">Descripción</div><textarea class="fi" id="eDesc" rows="2" placeholder="Opcional…" style="resize:vertical"></textarea></div>
    </div>
    <div class="e-foot">
      <button class="btn btn-g" onclick="closeEdit()">Cancelar</button>
      <button class="btn btn-p" onclick="saveVideo()">Guardar</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script type="module">

  projectId:"exani-dash-adeff",
  storageBucket:"exani-dash-adeff.firebasestorage.app",

  databaseURL:"https://exani-dash-adeff-default-rtdb.firebaseio.com"
};
let app; try { app=getApp(); } catch(err) { app=initializeApp(_cfg); }
const db   = getDatabase(app);

try { const s=JSON.parse(localStorage.getItem('exani_session')||'null'); if(s){S.user=s.user;S.role=s.role;S.picture=s.googlePicture;} } catch(e){}

// ── Estado ──
let all=[], editId=null, currentVideoId=null;
let loaded = false;
let viewMode = localStorage.getItem('dash_video_view')||'grid';
let favFilter = false;
const LS_FAV   = ()=> 'dash_fav_'  +(S.user||'x');
const LS_WATCH = ()=> 'dash_watch_'+(S.user||'x');
let favs   = new Set(JSON.parse(localStorage.getItem(LS_FAV())  ||'[]'));
let watched = new Set(JSON.parse(localStorage.getItem(LS_WATCH())||'[]'));

function saveFavs()    { localStorage.setItem(LS_FAV(),   JSON.stringify([...favs])); }
function saveWatched() { localStorage.setItem(LS_WATCH(), JSON.stringify([...watched])); }

if (!S.user) {
  const na=document.getElementById('noAuth'); na.style.display='flex';
} else {
  document.getElementById('mainPage').style.display='';

// ── Init ──
function init() {
  const av=document.getElementById('tAv');
  if(S.picture) av.innerHTML=`<img src="${S.picture}" onerror="this.style.display='none'"/>`;
  else av.textContent=(S.user||'?').slice(0,2).toUpperCase();
  document.getElementById('tName').textContent=S.user||'—';
  document.getElementById('tRole').textContent=S.role||'—';

  if(S.role==='Administrador'){
    document.getElementById('adminLbl').style.display='';
    document.getElementById('addBtn').style.display='';
  }

  setView(viewMode, true);

  const loadTimeout = setTimeout(() => {
    if (!loaded) {
      document.getElementById('content').innerHTML = `
        <div class="load-error">
          <div class="load-error-ico">📡</div>
          <p>No se pudo conectar con el servidor.<br>Verifica tu conexión e intenta de nuevo.</p>
          <button onclick="location.reload()">↺ Reintentar</button>
        </div>`;
    }
  }, 8000);

  onValue(ref(db,'videos'), snap => {
    clearTimeout(loadTimeout);
    loaded = true;
    all = snap.exists() ? Object.entries(snap.val()).map(([id,v])=>({id,...v})) : [];
    buildHelpers(); buildChips(); updateStats(); filter();
  }, err => {
    clearTimeout(loadTimeout);
    document.getElementById('content').innerHTML = `
      <div class="load-error">
        <div class="load-error-ico">⚠️</div>
        <p>Error al cargar los videos.<br><small style="color:var(--muted)">${err.message}</small></p>
        <button onclick="location.reload()">↺ Reintentar</button>
      </div>`;
  });
}

// ── Stats + progreso ──
function updateStats(){
  const wCount = [...watched].filter(id => all.find(v=>v.id===id)).length;
  document.getElementById('sTotal').textContent   = all.length;
  document.getElementById('sTemas').textContent   = new Set(all.map(v=>v.tema)).size;
  document.getElementById('sSubs').textContent    = new Set(all.map(v=>v.tema+'|'+v.subtema)).size;
  document.getElementById('sWatched').textContent = wCount;

  if(all.length>0){
    const pct = Math.round((wCount/all.length)*100);
    document.getElementById('progressWrap').style.display='';
    document.getElementById('progressFill').style.width=pct+'%';
    document.getElementById('progressPct').textContent=pct+'%';
  }
}

// ── Helpers datalist + filtro tema ──
function buildHelpers(){
  const temas=[...new Set(all.map(v=>v.tema).filter(Boolean))].sort();
  const subs=[...new Set(all.map(v=>v.subtema).filter(Boolean))].sort();
  const sel=document.getElementById('tFil');
  const cur=sel.value;
  sel.innerHTML='<option value="">Todos los temas</option>'+temas.map(t=>`<option value="${e(t)}">${e(t)}</option>`).join('');
  sel.value=cur;
  document.getElementById('dlT').innerHTML=temas.map(t=>`<option value="${e(t)}">`).join('');
  document.getElementById('dlS').innerHTML=subs.map(s=>`<option value="${e(s)}">`).join('');
}

// ── Vista grid/lista ──
function setView(mode, skipSave){
  viewMode=mode;
  if(!skipSave) localStorage.setItem('dash_video_view', mode);
  try{document.getElementById('vtGrid').classList.toggle('active',mode==='grid');document.getElementById('vtList').classList.toggle('active',mode==='list');}catch(e){}
  filter();
};

// ── Filtro favoritos ──
function toggleFavFilter(){
  favFilter=!favFilter;
  document.getElementById('favFilterBtn').classList.toggle('active', favFilter);
  filter();
};

// ── Filtrado principal ──
function filter(){
  const q  = document.getElementById('sInp').value.toLowerCase();
  const tf = document.getElementById('tFil').value.toLowerCase();
  let res  = all.filter(v =>
    (!tf||(v.tema||'').toLowerCase()===tf) &&
    (!q ||(v.title||'').toLowerCase().includes(q)||(v.tema||'').toLowerCase().includes(q)||(v.subtema||'').toLowerCase().includes(q)) &&
    (!favFilter || favs.has(v.id))
  );
  render(res);
};

const ICONS={'Pensamiento Matemático':'🔢','Comprensión Lectora':'📖','Ciencias':'🔬','Biología':'🧬','Química':'⚗️','Física':'⚡','Historia':'📜','Geografía':'🌎','Español':'📝','Inglés':'🌐','Premedicina':'🩺'};
const NOW = Date.now();
const WEEK = 7*24*60*60*1000;
let activeChip = '';

// ── Chip bar ──
function buildChips(){
  const temas=[...new Set(all.map(v=>v.tema).filter(Boolean))].sort();
  const bar=document.getElementById('chipBar');
  bar.innerHTML='<button class="chip active" data-tema="" onclick="setChip(this)">Todos</button>'+
    temas.map(t=>`<button class="chip" data-tema="${e(t)}" onclick="setChip(this)">${ICONS[t]||'📚'} ${e(t)}</button>`).join('');
}
window.setChip=btn=>{
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
  btn.classList.add('active');
  activeChip=btn.dataset.tema;
  document.getElementById('tFil').value=activeChip;
  filter();
};

// ── Render YouTube home grid ──
function render(videos){
  const area=document.getElementById('content');
  if(!loaded){area.innerHTML='<div class="spinner"></div>';return;}
  if(!videos.length){area.innerHTML=`<div class="empty"><div class="empty-ico">${favFilter?'💔':'📭'}</div><p>${favFilter?'No tienes favoritos aún.':'No hay videos aquí aún.'}</p></div>`;return;}
  const isA=S.role==='Administrador';
  const q=document.getElementById('sInp').value.trim();
  const tf=document.getElementById('tFil').value;
  if(tf || q){
    const hdr=tf?`<div class="yt-section-hdr">${ICONS[tf]||'📚'} ${e(tf)}</div>`:'';
    area.innerHTML=hdr+`<div class="yt-grid">${videos.map(v=>ytcard(v,isA)).join('')}</div>`;
  } else {
    const map={};
    videos.forEach(v=>{const t=v.tema||'Sin tema';if(!map[t])map[t]=[];map[t].push(v);});
    area.innerHTML=Object.entries(map).sort(([a],[b])=>a.localeCompare(b)).map(([tema,vids])=>{
      const ico=ICONS[tema]||'📚';
      return `<div class="yt-section-hdr">${ico} ${e(tema)}</div><div class="yt-grid">${vids.map(v=>ytcard(v,isA)).join('')}</div>`;
    }).join('');
  }
}

// ── YouTube-style card ──
function ytcard(v,isA){
  const src=source(v.url||'');
  const th=thumb(v.url||'',src);
  const thH=th?`<img src="${th}" loading="lazy" onerror="this.parentElement.innerHTML='<div class=yt-ph>▶️</div>'">`:`<div class="yt-ph">▶️</div>`;
  const isNew=(v.createdAt&&(NOW-v.createdAt)<WEEK);
  const isWatched=watched.has(v.id);
  const isFav=favs.has(v.id);
  const newBadge=isNew&&!isWatched?'<span class="yt-new">Nuevo</span>':'';
  const srcBadge=src==='youtube'?'<span class="yt-src src-youtube">YT</span>':'<span class="yt-src src-'+src+'">'+src+'</span>';
  const watchBar=isWatched?'<div class="yt-watched-bar full"></div>':'';
  const favCls=isFav?' active':'';
  const watchCls=isWatched?' active':'';
  const ico=ICONS[v.tema]||'📚';
  const viewsTxt=v.views?`${v.views} vista${v.views!==1?'s':''}`:'';
  const watchedTxt=isWatched?'<span style="color:#2ba640;font-weight:700">✓ Visto</span>':'';
  const favIcon=`<svg width="13" height="13" viewBox="0 0 24 24" fill="${isFav?'currentColor':'none'}" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>`;
  const watchIcon=`<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>`;
  const editIcon=`<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>`;
  const trashIcon=`<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>`;
  const adminBtns=isA?`<button class="yt-icon-btn" onclick="event.stopPropagation();openEdit('${v.id}')" title="Editar">${editIcon}</button><button class="yt-icon-btn" onclick="event.stopPropagation();delVideo('${v.id}','${e(v.title||'')}')" title="Eliminar">${trashIcon}</button>`:'';
  return `<div class="yt-card" onclick="play('${v.id}')">
    <div class="yt-thumb-wrap">
      ${thH}${newBadge}${srcBadge}${watchBar}
      <div class="yt-overlay"><div class="yt-play-btn"><svg width="18" height="18" viewBox="0 0 24 24" fill="#ff0000"><polygon points="5,3 19,12 5,21"/></svg></div></div>
    </div>
    <div class="yt-meta">
      <div class="yt-channel-av">${ico}</div>
      <div class="yt-info">
        <div class="yt-title">${e(v.title||'Sin título')}</div>
        <div class="yt-sub-info">
          <span class="yt-tema">${e(v.subtema||v.tema||'')}</span>
          <span>${viewsTxt} ${watchedTxt}</span>
        </div>
      </div>
    </div>
    <div class="yt-actions">
      <button class="yt-act-btn${isFav?' fav-active':''}" onclick="event.stopPropagation();toggleFav('${v.id}',this)">${favIcon} ${isFav?'Guardado':'Guardar'}</button>
      <button class="yt-act-btn${isWatched?' watch-active':''}" onclick="event.stopPropagation();toggleWatch('${v.id}',this)">${watchIcon} ${isWatched?'Visto':'Ver después'}</button>
      ${adminBtns}
    </div>
  </div>`;
}

function vcard(){} function vlistitem(){}

// ── Favoritos ──
function toggleFav(id,btn){
  if(favs.has(id)){favs.delete(id);if(btn){btn.classList.remove('fav-active');btn.innerHTML=btn.innerHTML.replace('Guardado','Guardar').replace('fill="currentColor"','fill="none"');}}
  else{favs.add(id);if(btn){btn.classList.add('fav-active');btn.innerHTML=btn.innerHTML.replace('Guardar','Guardado').replace('fill="none"','fill="currentColor"');}}
  saveFavs();
  if(currentVideoId===id) updatePlayerBtns();
  if(favFilter) filter();
};
window.toggleFavFromPlayer=()=>toggleFav(currentVideoId, null);

// ── Visto ──
function toggleWatch(id,btn){
  if(watched.has(id)){watched.delete(id);if(btn){btn.classList.remove('watch-active');btn.innerHTML=btn.innerHTML.replace('Visto','Ver después');}}
  else{watched.add(id);if(btn){btn.classList.add('watch-active');btn.innerHTML=btn.innerHTML.replace('Ver después','Visto');}}
  saveWatched(); updateStats(); filter();
  if(currentVideoId===id) updatePlayerBtns();
};
window.toggleWatchFromPlayer=()=>toggleWatch(currentVideoId, null);

function updatePlayerBtns(){
  document.getElementById('pFavBtn').classList.toggle('active', favs.has(currentVideoId));
  const wb=document.getElementById('pWatchBtn');
  wb.classList.toggle('active', watched.has(currentVideoId));
  wb.textContent=watched.has(currentVideoId)?'✓ Visto':'✓ Marcar visto';
}

// ── Player ──
async function play(id){
  const v=all.find(x=>x.id===id);if(!v)return;
  const em=embed(v.url||'');
  if(!em){toast('URL no compatible para embed');return;}
  currentVideoId=id;
  document.getElementById('pTtl').textContent=v.title||'Video';
  document.getElementById('pFr').src=em.src;
  const frame=document.getElementById('pFrameWrap');
  frame.style.paddingTop=em.vertical?'min(85vh, 177.78%)':'56.25%';
  frame.style.maxWidth=em.vertical?'360px':'';
  frame.style.margin=em.vertical?'0 auto':'';
  document.getElementById('pMeta').textContent=`${v.tema||''} › ${v.subtema||''}${v.desc?' — '+v.desc:''}`;
  updatePlayerBtns();

  // Contador de visitas
  try {
    await update(ref(db,`videos/${id}`), {views: (v.views||0)+1});
  } catch(err) {}
  document.getElementById('pViews').textContent=`👁 ${(v.views||0)+1} visitas`;

  document.getElementById('playerModal').classList.add('show');
  document.body.style.overflow='hidden';

  // Auto-ocultar footer
  const foot=document.getElementById('pMeta');
  clearTimeout(window._footTimer);
  foot.style.opacity='1';foot.style.transition='opacity .4s';
  window._footTimer=setTimeout(()=>{foot.style.opacity='0';},3000);
  document.getElementById('playerModal').onmousemove=()=>{
    foot.style.opacity='1';clearTimeout(window._footTimer);
    window._footTimer=setTimeout(()=>{foot.style.opacity='0';},2500);
  };

  // Marcar visto automáticamente si el usuario ya lo tenía o al cerrar
  window._autoWatchId=id;
};

function closePlayer(){
  document.getElementById('playerModal').classList.remove('show');
  document.getElementById('pFr').src='';
  document.body.style.overflow='';
  currentVideoId=null;
};

// ── Admin ──
window.openAdd=()=>{editId=null;document.getElementById('eH').textContent='Agregar video';['eUrl','eTtl','eTema','eSub','eDesc'].forEach(i=>document.getElementById(i).value='');document.getElementById('uPrev').classList.remove('show');document.getElementById('editModal').classList.add('show');};
window.openEdit=id=>{const v=all.find(a=>a.id===id);if(!v)return;editId=id;document.getElementById('eH').textContent='Editar video';document.getElementById('eUrl').value=v.url||'';document.getElementById('eTtl').value=v.title||'';document.getElementById('eTema').value=v.tema||'';document.getElementById('eSub').value=v.subtema||'';document.getElementById('eDesc').value=v.desc||'';prevUrl();document.getElementById('editModal').classList.add('show');};
window.closeEdit=()=>{document.getElementById('editModal').classList.remove('show');document.getElementById('pIfr').src='';};
window.prevUrl=()=>{const em=embed(document.getElementById('eUrl').value.trim());const p=document.getElementById('uPrev');if(em){document.getElementById('pIfr').src=em.src;p.style.aspectRatio=em.vertical?'9/16':'16/9';p.classList.add('show');}else{p.classList.remove('show');document.getElementById('pIfr').src='';}};
window.saveVideo=async()=>{
  const url=document.getElementById('eUrl').value.trim(),title=document.getElementById('eTtl').value.trim(),tema=document.getElementById('eTema').value.trim(),sub=document.getElementById('eSub').value.trim(),desc=document.getElementById('eDesc').value.trim();
  if(!url||!title||!tema||!sub){toast('⚠️ Completa los campos obligatorios');return;}
  const data={url,title,tema,subtema:sub,desc,updatedAt:Date.now()};
  try{if(editId){await update(ref(db,`videos/${editId}`),data);toast('✅ Actualizado');}else{data.createdAt=Date.now();await push(ref(db,'videos'),data);toast('✅ Agregado');}closeEdit();}catch(err){toast('❌ '+err.message);}
};
window.delVideo=async(id,title)=>{
  if(!confirm(`¿Eliminar "${title}"?`))return;
  try{await remove(ref(db,`videos/${id}`));toast('🗑 Eliminado');}catch(err){toast('❌ '+err.message);}
};

// ── Utilidades ──
function source(url){if(/youtube\.com|youtu\.be/.test(url))return'youtube';if(/tiktok\.com/.test(url))return'tiktok';if(/drive\.google\.com/.test(url))return'drive';if(/vimeo\.com/.test(url))return'vimeo';return'otro';}
function embed(url){let m;m=url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/);if(m)return{src:`https://www.youtube.com/embed/${m[1]}?rel=0&modestbranding=1`,vertical:false};m=url.match(/youtube\.com\/shorts\/([a-zA-Z0-9_-]{11})/);if(m)return{src:`https://www.youtube.com/embed/${m[1]}?rel=0`,vertical:true};m=url.match(/vimeo\.com\/(\d+)/);if(m)return{src:`https://player.vimeo.com/video/${m[1]}`,vertical:false};m=url.match(/drive\.google\.com\/file\/d\/([^/]+)/);if(m)return{src:`https://drive.google.com/file/d/${m[1]}/preview`,vertical:false};return null;}
function thumb(url,src){
  if(src!=='youtube')return null;
  const m=url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|shorts\/)([a-zA-Z0-9_-]{11})/);
  return m?`https://img.youtube.com/vi/${m[1]}/mqdefault.jpg`:null;
}
function e(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600);}
window.goBack=()=>document.referrer.includes(location.hostname)?history.back():(location.href='index.html');
window.setView=setView;
window.toggleFavFilter=toggleFavFilter;
window.filter=filter;
window.toggleFav=toggleFav;
window.toggleWatch=toggleWatch;
window.play=play;
window.closePlayer=closePlayer;

document.addEventListener('keydown',ev=>{if(ev.key==='Escape'){closePlayer();closeEdit();}});
